services:
  backend:
    build:
      context: ./backend
      args:
        # China mirrors by default; override with PIP_INDEX_URL env var if needed.
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/rental_app.db
      BACKUP_DIR: /app/backups
      AUTO_EXPORT_DIR: /app/exports
      TZ: Asia/Shanghai
      # 请求耗时日志写入已挂载的 ./data/logs/，便于宿主机查看
      LOG_DIR: /app/data/logs
      # 支付方式功能开关（默认关闭）：本地测试可在 .env 设 ENABLE_PAYMENT_METHOD=1
      ENABLE_PAYMENT_METHOD: ${ENABLE_PAYMENT_METHOD:-0}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./exports:/app/exports
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # China mirrors by default; override with NPM_REGISTRY env var if needed.
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
