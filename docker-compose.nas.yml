# NAS deployment — single container (frontend + backend combined).
# Image: watersports-rental:<version>（导入对应版本 tar 后获得）
# Access: http://<NAS-IP>:6688
# 首次登录：superuserx / 123456（仅首次建库生效，登录后请及时改密）
#
# 完全不使用此文件也可以：在 Container Manager 界面手动创建容器，
# 端口 6688->8000，挂载三个目录（见下方 volumes），环境变量只需 SESSION_SECRET。
#
# 镜像已内置全部默认值（数据库路径、备份/导出/日志目录、时区、
# SESSION_COOKIE_SECURE=false、SEED_DEFAULT_DATA=false、请求耗时开关等），
# 无需重复配置。

services:
  app:
    image: watersports-rental:1.1.15
    container_name: rental-app
    restart: unless-stopped
    ports:
      - "6688:8000"
    environment:
      # 必填：填写一段随机长字符串；留空则使用内置默认值（仅建议测试时）
      SESSION_SECRET: change-me-to-a-long-random-secret
      # 忘记密码时：取消下一行注释设为新密码，启动一次后再注释掉
      # SUPERUSER_PASSWORD_RESET: newpassword
    volumes:
      # SQLite 数据库 rental_app.db 及日志 data/logs/
      # （backend-requests-日期.log = 后端请求耗时；frontend-trace-日期.log = 前端上报，
      #   两者均按天生成，文件名带当天日期，默认保留 30 天）
      - /volume1/docker/sportrentalmanager/data:/app/data
      # 数据库手动/自动备份
      - /volume1/docker/sportrentalmanager/backups:/app/backups
      # 每日 00:00 自动导出的订单 CSV
      - /volume1/docker/sportrentalmanager/exports:/app/exports
