# 腾讯云生产环境入口：HTTPS 终止 + 反向代理到 FastAPI
# 挂载到容器内 /etc/nginx/conf.d/default.conf

server {
    listen 80;
    server_name wsmanager.cn www.wsmanager.cn;

    # HTTP 一律永久重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wsmanager.cn www.wsmanager.cn;

    ssl_certificate     /etc/nginx/certs/wsmanager.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/certs/wsmanager.cn.key;

    # 前端由 FastAPI 直接提供，避免代理层重复压缩
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 后端登录限流优先读取 X-Real-IP，这里必须传真实客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
